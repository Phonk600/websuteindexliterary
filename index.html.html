<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writers of the World</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef3;--ink:#14213d;--muted:#52607a;--panel:#fff;--blue:#2f4bff;--gold:#f2a93b;--teal:#0e8f7e;--line:#c9d3df}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;line-height:1.65;font-size:17px}
header{padding:48px 6vw 24px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between}
h1{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1;letter-spacing:-.03em;max-width:12ch}
.tabs{display:flex;background:var(--panel);border-radius:999px;padding:5px;border:1px solid var(--line)}
.tabs button{font:600 .95rem 'Bricolage Grotesque',Arial,sans-serif;border:0;background:none;color:var(--muted);padding:10px 22px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
main{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:32px;padding:16px 6vw 72px;align-items:start}
nav ul{list-style:none;border-top:2px solid var(--ink)}
nav li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 8px;cursor:pointer;font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:500;font-size:1.55rem;line-height:1.15;color:var(--muted);display:block;transition:padding .2s,color .2s}
nav li button small{display:block;font:italic 400 .9rem 'Source Serif 4',serif;margin-top:4px}
nav li button:hover{color:var(--ink)}
nav li button[aria-current="true"]{color:var(--blue);font-weight:800;padding-left:22px;border-left:5px solid var(--blue)}
article{background:var(--panel);border-radius:28px;padding:clamp(24px,4vw,56px);border:1px solid var(--line);min-height:520px}
.top{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.top .info{flex:1;min-width:220px}
.photo{width:200px;aspect-ratio:3/4;object-fit:cover;border-radius:20px;background:var(--bg);border:1px solid var(--line);display:block}
.ph{width:200px;aspect-ratio:3/4;border-radius:20px;background:var(--bg);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.9rem;padding:12px}
.tag{display:inline-block;font:600 .85rem 'Bricolage Grotesque',Arial,sans-serif;padding:5px 14px;border-radius:999px;background:var(--gold);color:var(--ink)}
.tag.intl{background:var(--teal);color:#fff}
article h2{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:clamp(2rem,4.5vw,3.4rem);line-height:1.05;letter-spacing:-.02em;margin:18px 0 6px}
.facts{color:var(--muted);font-style:italic}
article p.body{max-width:64ch;margin-bottom:1em}
.work{margin-top:32px;padding:24px 28px;border-radius:20px;background:var(--ink);color:#e9eef3}
.work h3{font-family:'Bricolage Grotesque',Arial,sans-serif;font-size:1.5rem;font-weight:800;color:var(--gold);margin-bottom:8px}
.work p{max-width:62ch}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(max-width:820px){main{grid-template-columns:1fr}article{min-height:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Writers of the World</h1>
  <div class="tabs" role="tablist" aria-label="Choose a group">
    <button role="tab" id="t-local" aria-selected="true">Local writers</button>
    <button role="tab" id="t-intl" aria-selected="false">International writers</button>
  </div>
</header>

<main>
  <nav aria-label="Writers"><ul id="list"></ul></nav>
  <article id="detail" aria-live="polite"></article>
</main>

 b:["Nicomedes “Nick” Marquez Joaquin, also known as “Onching” and by the pen name Quijano de Manila, was born in Paco, Manila. He was the fifth of ten children of Don Leocadio Joaquin, a former colonel of the Philippine Revolution, and Salomé Marquez, a public school teacher. After his father lost the family fortune in a failed oil investment, the family moved to Pasay.","He left Mapa High School in his third year, feeling he learned more outside the classroom. At 17 he published his first English poem in the Tribune, and in 1937 his first short story, “The Sorrows of Vaudeville.” He later became a National Artist of the Philippines for Literature."],

 b:["José Protasio Rizal Mercado y Alonso Realonda was born in Calamba, Laguna, the seventh child of Francisco Rizal Mercado and Teodora Alonso Realonda. His mother taught him to read, write, pray, and love poetry. He began formal schooling in Biñan under Justiniano Aquino Cruz and later continued in Manila.","A leading voice of the Propaganda Movement, he used his writing to expose Spanish abuses and call for reform. He was arrested in 1892 and exiled to Dapitan, where he met Josephine Bracken. Spanish authorities executed him in 1896, and he is widely regarded as the national hero."],
 w:"Noli Me Tángere (1887)",s:"“Touch Me Not” exposes the injustice, corruption, and discrimination Filipinos suffered under Spanish rule, especially the abuses of officials and friars. Together with its sequel, El Filibusterismo, it is required reading in Filipino high schools under the Rizal Law."},

 b:["Francisco Sionil José was born in Rosales, Pangasinan, to a poor Ilocano family. His hardworking mother encouraged his love of books. He began writing in grade school, inspired by Rizal, William Faulkner, and John Steinbeck, and left the University of Santo Tomas to pursue writing and journalism in Manila.","He became an editor, a publisher, and the founder of Philippine PEN. Named a National Artist for Literature in 2001, his works have been translated into 28 languages, and he was often named a leading Filipino candidate for the Nobel Prize in Literature."],
 w:"The Rosales Saga (1962–1984)",s:"Five novels: The Pretenders, Tree, My Brother, My Executioner, Mass, and Po-on. They follow five generations of the poor Samsons and the wealthy Asperris through Spanish and American rule and the years after independence, exploring inequality, class, and colonialism."},
{n:"Merlinda Bobis",img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0uGirGbtsdwDiRE7BgZentArTn0Sp83S6n_dUVTiqDQ&s=10",f:"Born November 25, 1959 · Filipina-Australian · Writer, dancer, visual artist, academic",
 b:["Merlinda Carullo Bobis was born in Legazpi City, Albay, and grew up in the Bikol region, where local culture and storytelling shaped her creativity. She began writing poetry at ten and studied at Aquinas University, the University of Santo Tomas, and the University of Wollongong, where she earned her doctorate in 1995.","Now based in Australia, she writes in English, Filipino, and Bikol, blending traditional Filipino culture with themes of migration. Her awards include the Prix Italia, Steele Rudd Award, Philippine National Book Award, and Christina Stead Prize for Fiction."],
 w:"Banana Heart Summer (2005)",s:"Nenita, a twelve-year-old growing up in poverty, finds comfort in cooking for a beautiful woman in her neighborhood. Through food she expresses love and hope while facing a complicated relationship with her mother, in a story about family, friendship, and community."},
{n:"Lualhati Bautista",img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRszBaLa3YzNa6PVzSjvgULZl9ksOSuUVmEXavJ4TD9SQ&s=10",f:"December 2, 1945 – February 12, 2023 · Filipina · Novelist, activist, political critic",
 b:["Lualhati Torres Bautista was born in Tondo, Manila, to Esteban Bautista and Gloria Torres. She briefly studied journalism at the Lyceum of the Philippines before leaving to become a writer. Her first short story, “Katugon ng Damdamin,” appeared in Liwayway magazine.","With no formal literary training, she became known for realistic writing that highlights women’s struggles in the family and at work. Her best-known novels are Dekada ’70 (1983), Bata, Bata… Pa’no Ka Ginawa?, and ’GAPÔ (both 1988)."],
 w:"Bata, Bata… Pa’no Ka Ginawa?",s:"Lea, a working mother of two, faces the challenges of motherhood and work in modern times. The novel traces how society’s view of women has shifted from household roles to voice, freedom, and rights. It was filmed in 1998 with Vilma Santos, directed by Chito S. Roño."}
],
intl:[
{n:"William Shakespeare",img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzG8AIO9sjk_AqwL0YI8qiqeNnmyNTKydAuXY1T4CbPw&s",f:"April 23, 1564 – April 23, 1616 · English · Playwright, poet, actor",
 b:["Born in Stratford-upon-Avon to John Shakespeare and Mary Arden, he married Anne Hathaway and had three children. His plays and poems explore love, jealousy, ambition, betrayal, and tragedy, and were performed at the Globe Theatre in London.","He is widely regarded as one of the greatest writers in English literature, and his influence reaches theater, literature, and the English language itself."],
 w:"Romeo and Juliet · Tragedy / Romance",s:"Two young people from the rival Montague and Capulet families fall in love and secretly marry, hoping to end the feud. A misunderstanding leads Romeo to believe Juliet is dead, and he takes his own life. Juliet wakes, finds him dead, and does the same. Their deaths finally bring peace."},
{n:"Gabriel García Márquez",img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQd_7rF_in2Y7Qljia207IIsjQ3YhHnUjV2HGuyAxuZcw&s=10",f:"March 6, 1927 – April 17, 2014 · Colombian · Novelist, journalist, short-story writer",
 b:["Gabriel José de la Concordia García Márquez was born in Aracataca, Colombia, and raised mainly by his maternal grandparents, whose stories fed his imagination. He studied law before turning to journalism and literature.","He became world famous for magical realism, which blends realistic events with the supernatural, and won the Nobel Prize in Literature in 1982."],
 w:"One Hundred Years of Solitude · Magical Realism",s:"The Buendía family lives through seven generations in the fictional town of Macondo, experiencing love, war, loneliness, and magical events. As generations pass they repeat the same mistakes, showing how time, history, and destiny are connected, until the family and the town come to an end."},
{n:"Maya Angelou",img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSYyiau-ZTo1_zq7IfBvBxCPDZA7G3whpOjteFVQZFcw&s",f:"April 4, 1928 – May 28, 2014 · American · Poet, memoirist, civil rights activist",
 b:["Born Marguerite Annie Johnson in St. Louis, Missouri, she had a difficult childhood marked by racism and personal struggle. She worked as a singer, dancer, actress, and journalist before becoming a celebrated writer.","Her work focuses on identity, racism, womanhood, and courage. She worked alongside important civil rights leaders and received numerous awards."],
 w:"I Know Why the Caged Bird Sings · Autobiography",s:"A memoir of her childhood as a Black girl in America during an era of racism and discrimination. Facing prejudice, trauma, and questions of identity, she discovers the power of reading, education, and writing, and grows into courage and confidence."},
{n:"Haruki Murakami",img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcppdXAXirPY4pWM3qlkUNMo6vx_fW1zGBxtJDO8OF-w&s",f:"Born January 12, 1949 · Japanese · Novelist, short-story writer, translator",
 b:["Born in Kyoto and raised in Kobe, he developed an early interest in Western literature, music, and culture. He studied drama at Waseda University in Tokyo, where he met his wife, Yoko, and the couple later ran a jazz bar called Peter Cat.","His style blends reality, dreams, loneliness, mystery, and the supernatural, with recurring themes of love, isolation, memory, and the search for identity."],
 w:"Norwegian Wood · Novel",s:"College student Toru Watanabe looks back on his younger years and his relationships with two women: Naoko, who is deeply affected by the death of a close friend, and Midori, who is cheerful, independent, and full of life. He struggles with love, grief, and loneliness while learning what it means to lose someone and to grow up."},
{n:"Chimamanda Ngozi Adichie",img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYncXSda-9-8Q7xqLOdAxwwfaQ1cSJMrX5QxOxNI7M6w&s=10",f:"Born September 15, 1977 · Nigerian · Novelist, short-story writer, essayist",
 b:["Born in Enugu and raised in Nsukka, where her parents worked at the University of Nigeria, she studied medicine and pharmacy before moving to the United States at 19. She studied communication and political science at Eastern Connecticut State University and earned a master’s in creative writing from Johns Hopkins University.","Her writing explores African identity, gender equality, racism, immigration, and women’s experiences, and she is known worldwide for her talks on feminism and telling African stories."],
 w:"Half of a Yellow Sun · Historical Novel",s:"Set during the Nigerian Civil War (the Biafran War), it follows Ugwu, a young houseboy; Olanna, a professor’s partner; and Richard, an English writer. War, violence, hunger, and political conflict reshape their lives as they fight to protect their loved ones and their hopes."}
]};

let group="local",idx=0;
const list=document.getElementById("list"),box=document.getElementById("detail");
const tabs={local:document.getElementById("t-local"),intl:document.getElementById("t-intl")};

function render(){
  list.innerHTML=data[group].map((w,i)=>`<li><button data-i="${i}" ${i===idx?'aria-current="true"':''}>${w.n}<small>${w.f.split(" · ")[1]}</small></button></li>`).join("");
  const w=data[group][idx];
  const pic=w.img?`<img class="photo" src="${w.img}" alt="Photo of ${w.n}">`:`<div class="ph">Add photo of ${w.n}</div>`;
  box.innerHTML=`<div class="top">${pic}<div class="info">
    <span class="tag ${group==="intl"?"intl":""}">${group==="intl"?"International":"Local"} writer</span>
    <h2>${w.n}</h2><p class="facts">${w.f}</p></div></div>
  ${w.b.map(p=>`<p class="body">${p}</p>`).join("")}
  <div class="work"><h3>${w.w}</h3><p>${w.s}</p></div>`;
}
list.addEventListener("click",e=>{const b=e.target.closest("button");if(b){idx=+b.dataset.i;render();}});
Object.keys(tabs).forEach(k=>tabs[k].addEventListener("click",()=>{
  group=k;idx=0;
  Object.keys(tabs).forEach(x=>tabs[x].setAttribute("aria-selected",x===k));
  render();
}));
render();
</script>
